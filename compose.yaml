services:
  # Portable Linux CPU container. It runs natively through Docker on Linux,
  # Windows, Intel Macs, and Apple Silicon Macs.
  artifact:
    image: "ghcr.io/idahera/static-sbfl-for-nn:${SBFL_IMAGE_VERSION:-v1.0.0-sefm26-ae}-cpu"
    build:
      context: .
      target: final
    environment:
      SBFL_DEVICE: cpu
    volumes:
      - ./data:/workspace/data
      - ./outputs:/workspace/outputs
    working_dir: /workspace
    command: ["python", "artifact/check_environment.py", "--expect-device", "cpu"]

  # Full reproduction service. CUDA passthrough is supported on native Linux
  # and on Windows through Docker Desktop's WSL2 backend, but not on macOS.
  artifact-gpu:
    profiles: ["gpu"]
    platform: linux/amd64
    image: "ghcr.io/idahera/static-sbfl-for-nn:${SBFL_IMAGE_VERSION:-v1.0.0-sefm26-ae}-cuda"
    build:
      context: .
      target: cuda
    environment:
      SBFL_DEVICE: cuda
    volumes:
      - ./data:/workspace/data
      - ./outputs:/workspace/outputs
    working_dir: /workspace
    gpus: all
    command: ["bash", "artifact/run_pipeline.sh", "full"]
