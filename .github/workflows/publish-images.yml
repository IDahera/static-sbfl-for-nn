name: Publish artifact images

on:
  release:
    types: [published]

concurrency:
  group: publish-artifact-images-${{ github.event.release.id }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: Publish ${{ matrix.variant }} image
    runs-on: ubuntu-latest
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            target: final
            platforms: linux/amd64,linux/arm64
          - variant: cuda
            target: cuda
            platforms: linux/amd64

    steps:
      - name: Check out the released source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up QEMU
        if: matrix.variant == 'cpu'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}-${{ matrix.variant }},priority=900
            type=raw,value=sefm26-${{ matrix.variant }},enable=${{ endsWith(github.event.release.tag_name, '-sefm26-ae') && !github.event.release.prerelease }},priority=200
            type=sha,format=long,suffix=-${{ matrix.variant }},priority=100
          labels: |
            org.opencontainers.image.title=Static SBFL for Neural Networks (${{ matrix.variant }})
            org.opencontainers.image.description=SEFM 2026 artifact container
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.event.release.tag_name }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platforms }}
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
